services:
  jupyter:
    build:
      context: ..
      dockerfile: build/Dockerfile
    image: alchemi-playbook:latest
    container_name: alchemi-playbook-jupyter
    # OVITO ships only x86_64 builds on conda.ovito.org; the container
    # must therefore run on an x86_64 host. See ../README.md.
    platform: linux/amd64
    networks: [alchemi-net]
    ports:
      - "8888:8888"
    shm_size: 8g
    # Selective bind-mounts. Students see only tutorial content under
    # /workspace; build/, start-*, and dotfiles stay hidden.
    volumes:
      - ../part-1-batched-adsorption:/workspace/part-1-batched-adsorption
      - ../part-2-toolkit:/workspace/part-2-toolkit
      - ../README.md:/workspace/README.md:ro
      - ../LICENSE:/workspace/LICENSE:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  alchemi-net:
    driver: bridge
