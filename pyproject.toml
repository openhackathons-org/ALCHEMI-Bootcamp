[project]
name = "alchemi-tutorials"
version = "0.0.0"
description = "Locked authoring and runtime environment for the ALCHEMI Toolkit tutorials"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aimnet==0.2.0",
    "ase==3.27.0",
    "dm-tree==0.1.10",
    "mace-torch==0.3.15",
    "matplotlib>=3.10,<4",
    "nvalchemi-toolkit[mace] @ git+https://github.com/NVIDIA/nvalchemi-toolkit.git@31ab73ed0b0bcf44e4769467dff06b7d2674bd37",
    "nvalchemi-toolkit-ops[torch-cu13] @ git+https://github.com/NVIDIA/nvalchemi-toolkit-ops.git@6702138e404d40ea79dec62f68c2fa67e858580e",
    "numpy>=2,<2.4",
    "pandas>=2.3,<3",
    "py3dmol==2.5.5",
    "rdkit==2026.3.4",
    "torch==2.12.0",
    "zarr>=3,<4",
]

[dependency-groups]
kernel = [
    "ipython>=9,<10",
    "ipykernel>=7,<8",
    "ipywidgets>=8.1,<9",
]
lab = [
    "jupyterlab>=4,<5",
]
test = [
    "packaging>=26,<27",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
default-groups = ["kernel", "lab", "test"]
index-strategy = "unsafe-best-match"
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
