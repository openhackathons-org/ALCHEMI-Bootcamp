[project]
name = "alchemi-tutorials"
version = "0.0.0"
description = "Locked authoring and runtime environment for the ALCHEMI Toolkit tutorials"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aimnet==0.2.0",
    "ase==3.27.0",
    "mace-torch==0.3.15",
    "matplotlib>=3.10,<4",
    "nvalchemi-toolkit[aimnet,ase,mace] @ git+https://github.com/NVIDIA/nvalchemi-toolkit.git@8c2c307c1c0c76baee6f7a68eb75a45da83ffd18",
    "nvalchemi-toolkit-ops[torch-cu13] @ git+https://github.com/NVIDIA/nvalchemi-toolkit-ops.git@c1e23460859a784e1d78043bcd1c8af0d1095fa2",
    "numpy>=2,<2.4",
    "py3dmol==2.5.5",
    "rich==14.1.0",
    "torch==2.12.0",
    "zarr>=3,<4",
]

[dependency-groups]
notebook = [
    "ipykernel>=7,<8",
    "jupyterlab>=4,<5",
]
test = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
default-groups = ["notebook", "test"]
index-strategy = "unsafe-best-match"
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
