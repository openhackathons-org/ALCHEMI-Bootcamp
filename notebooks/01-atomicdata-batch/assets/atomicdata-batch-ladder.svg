<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">From a scientific structure to a Toolkit batch</title>
  <desc id="desc">A vertical sequence from an ASE or pymatgen structure, through one AtomicData object, to a Batch containing several systems.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#7C8794"/>
    </marker>
  </defs>
  <rect width="760" height="390" rx="16" fill="#0B0F10"/>
  <g font-family="NVIDIA Sans, Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="24" width="520" height="78" rx="12" fill="#3A332C" stroke="#4A423A"/>
    <text x="380" y="57" fill="#F3F4F6" font-size="20" font-weight="650">Molecule or structure</text>
    <text x="380" y="82" fill="#C7CDD4" font-size="14">ASE Atoms or pymatgen object</text>

    <path d="M380 102V144" stroke="#7C8794" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="411" y="129" fill="#9BA4AE" font-size="13" text-anchor="start">convert</text>

    <rect x="120" y="151" width="520" height="78" rx="12" fill="#314617" stroke="#4D6828"/>
    <text x="380" y="184" fill="#F3F4F6" font-size="20" font-weight="650">AtomicData</text>
    <text x="380" y="209" fill="#D7E4C6" font-size="14">one system as validated tensors</text>

    <path d="M380 229V271" stroke="#7C8794" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="411" y="256" fill="#9BA4AE" font-size="13" text-anchor="start">pack</text>

    <rect x="120" y="278" width="520" height="78" rx="12" fill="#76B900" stroke="#8DD21A"/>
    <text x="380" y="311" fill="#071004" font-size="20" font-weight="700">Batch</text>
    <text x="380" y="336" fill="#132004" font-size="14" font-weight="550">several systems in packed tensor storage</text>
  </g>
</svg>
