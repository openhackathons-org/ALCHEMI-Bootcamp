<svg xmlns="http://www.w3.org/2000/svg" width="920" height="96" viewBox="0 0 920 96" role="img" aria-labelledby="title desc">
<title id="title">Saved Zarr records to a model-device Batch</title>
<desc id="desc">A Zarr store on disk or in CPU storage feeds a Reader that returns CPU tensors. Dataset chooses the target device, DataLoader batches and prefetches, and the result is a Batch on the model device.</desc>
<defs><marker id="zarr-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68737E"/></marker></defs>
<rect width="920" height="96" rx="8" fill="#11161B"/>
<g font-family="NVIDIA Sans,Arial,sans-serif" text-anchor="middle">
<rect x="20" y="18" width="176" height="60" rx="7" fill="#3A332C" stroke="#76B900" stroke-width="1.5"/>
<text x="108" y="43" fill="#F3F4F6" font-size="14" font-weight="700">Zarr store</text>
<text x="108" y="63" fill="#CDD2D8" font-size="11">disk or CPU storage</text>
<rect x="220" y="18" width="144" height="60" rx="7" fill="#20262C" stroke="#68737E"/>
<text x="292" y="43" fill="#F3F4F6" font-size="14" font-weight="700">Reader</text>
<text x="292" y="63" fill="#CDD2D8" font-size="11">CPU tensors</text>
<rect x="388" y="18" width="144" height="60" rx="7" fill="#20262C" stroke="#76B900"/>
<text x="460" y="43" fill="#F3F4F6" font-size="14" font-weight="700">Dataset</text>
<text x="460" y="63" fill="#CDD2D8" font-size="11">target device</text>
<rect x="556" y="18" width="152" height="60" rx="7" fill="#20262C" stroke="#68737E"/>
<text x="632" y="43" fill="#F3F4F6" font-size="14" font-weight="700">DataLoader</text>
<text x="632" y="63" fill="#CDD2D8" font-size="11">batch + prefetch</text>
<rect x="732" y="18" width="168" height="60" rx="7" fill="#76B900" stroke="#76B900"/>
<text x="816" y="43" fill="#081005" font-size="14" font-weight="700">Batch</text>
<text x="816" y="63" fill="#15200D" font-size="11">model device</text>
<path d="M203 48H213" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/>
<path d="M371 48H381" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/>
<path d="M539 48H549" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/>
<path d="M715 48H725" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/>
</g>
</svg>
