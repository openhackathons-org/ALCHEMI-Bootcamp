<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-labelledby="title desc"><title id="title">Interactive ALCHEMI Toolkit capability map</title><desc id="desc">A branched map links Toolkit data, model, workflow, training, and distributed capabilities to focused course notebooks and scientific applications. Hover or focus a capability for public API details.</desc><defs><filter id="soft-glow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#76B900" flood-opacity=".28"/></filter><marker id="cap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68737E"/></marker><style>
.label{font:700 14px 'NVIDIA Sans',Arial,sans-serif}.sub{font:500 11px 'NVIDIA Sans',Arial,sans-serif}.group{font:700 13px 'NVIDIA Sans',Arial,sans-serif}.detail-title{font:700 14px 'NVIDIA Sans',Arial,sans-serif}.detail-copy{font:500 11px 'NVIDIA Sans',Arial,sans-serif}.leaf rect{transition:fill 150ms cubic-bezier(.23,1,.32,1),stroke 150ms cubic-bezier(.23,1,.32,1),filter 150ms cubic-bezier(.23,1,.32,1)}.leaf:hover rect,.leaf:focus rect{fill:#26351D;stroke:#76B900;filter:url(#soft-glow)}.leaf:focus{outline:none}.detail{opacity:0;transition:opacity 160ms ease;pointer-events:none}.detail-default{opacity:1}.leaf:hover~.detail-default,.leaf:focus~.detail-default{opacity:0}
#atomic:hover~#detail-atomic,#atomic:focus~#detail-atomic{opacity:1}
#zarr:hover~#detail-zarr,#zarr:focus~#detail-zarr{opacity:1}
#wrappers:hover~#detail-wrappers,#wrappers:focus~#detail-wrappers{opacity:1}
#composition:hover~#detail-composition,#composition:focus~#detail-composition{opacity:1}
#hooks:hover~#detail-hooks,#hooks:focus~#detail-hooks{opacity:1}
#dynamics:hover~#detail-dynamics,#dynamics:focus~#detail-dynamics{opacity:1}
#training:hover~#detail-training,#training:focus~#detail-training{opacity:1}
#distributed:hover~#detail-distributed,#distributed:focus~#detail-distributed{opacity:1}
@media (prefers-reduced-motion:reduce){.leaf rect,.detail{transition:none}}</style></defs><rect width="940" height="560" rx="10" fill="#11161B"/><text x="24" y="28" fill="#F3F4F6" font-family="NVIDIA Sans,Arial,sans-serif" font-size="19" font-weight="700">Build an atomistic workflow from reusable Toolkit capabilities</text><text x="24" y="49" fill="#A8B0B8" font-family="NVIDIA Sans,Arial,sans-serif" font-size="11">Hover, focus, or open a capability. Each leaf links to its focused notebook.</text><path d="M188 240 H210 V71 H226" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M188 240 H210 V175 H226" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M188 240 H210 V279 H226" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M188 240 H210 V383 H226" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M408 71 H448 V62 H466" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M408 71 H686 V62 H704" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M408 175 H448 V166 H466" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M408 175 H686 V166 H704" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M408 279 H448 V270 H466" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M408 279 H686 V270 H704" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M408 383 H448 V374 H466" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M408 383 H686 V374 H704" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><rect x="24" y="206" width="164" height="68" rx="8" fill="#76B900" stroke="#76B900"/><text x="106" y="235" class="label" fill="#081005" text-anchor=