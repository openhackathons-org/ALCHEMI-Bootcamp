<svg xmlns="http://www.w3.org/2000/svg" width="920" height="154" viewBox="0 0 920 154" role="img" aria-labelledby="title desc"><title id="title">Batch persistence and model-loading path</title><desc id="desc">An in-memory Batch is written to a Zarr store. AtomicDataZarrReader returns raw CPU tensors, Dataset validates AtomicData records, and DataLoader collates a model-ready Batch.</desc><defs><marker id="zarr-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68737E"/></marker></defs><rect width="920" height="154" rx="8" fill="#11161B"/><g font-family="NVIDIA Sans,Arial,sans-serif" text-anchor="middle"><text x="460" y="26" fill="#F3F4F6" font-size="18" font-weight="700">From a resident batch to the next model input</text><rect x="20" y="48" width="144" height="62" rx="6" fill="#3A332C" stroke="#68737E"/><text x="92.0" y="75" fill="#F3F4F6" font-size="14" font-weight="700">Batch</text><text x="92.0" y="96" fill="#F3F4F6" font-size="11">resident tensors</text><rect x="204" y="48" width="144" height="62" rx="6" fill="#20262C" stroke="#68737E"/><text x="276.0" y="75" fill="#F3F4F6" font-size="14" font-weight="700">Zarr store</text><text x="276.0" y="96" fill="#F3F4F6" font-size="11">persistent arrays</text><rect x="388" y="48" width="144" height="62" rx="6" fill="#20262C" stroke="#76B900"/><text x="460.0" y="75" fill="#F3F4F6" font-size="14" font-weight="700">Reader</text><text x="460.0" y="96" fill="#F3F4F6" font-size="11">raw CPU tensors</text><rect x="572" y="48" width="144" height="62" rx="6" fill="#20262C" stroke="#76B900"/><text x="644.0" y="75" fill="#F3F4F6" font-size="14" font-weight="700">Dataset</text><text x="644.0" y="96" fill="#F3F4F6" font-size="11">validated AtomicData</text><rect x="756" y="48" width="144" height="62" rx="6" fill="#76B900" stroke="#76B900"/><text x="828.0" y="75" fill="#081005" font-size="14" font-weight="700">DataLoader</text><text x="828.0" y="96" fill="#081005" font-size="11">model-ready Batch</text><path d="M171 79H197" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/><path d="M355 79H381" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/><path d="M539 79H565" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/><path d="M723 79H749" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/></g><text x="20" y="137" fill="#A8B0B8" font-family="NVIDIA Sans,Arial,sans-serif" font-size="11">Storage preserves fields and ownership; Dataset restores graph validation before batching.</text></svg>
