<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="312" viewBox="0 0 920 260" role="img" aria-labelledby="title desc"><title id="title">Atom-row ownership inside the example Batch</title><desc id="desc">The packed atomic number rows for ammonia, propyne, and phenol align with repeated batch index values. Batch pointer values zero, four, eleven, and twenty-four mark the system boundaries.</desc><rect width="920" height="260" rx="8" fill="#171D20"/><g font-family="NVIDIA Sans,Arial,sans-serif"><text x="24" y="29" fill="#F3F4F6" font-size="17" font-weight="700">One column per atom row</text><text x="24" y="48" fill="#A8B0B8" font-size="11">batch_idx assigns each row to a system; batch_ptr marks where each system starts and ends.</text><rect x="24" y="56" width="872" height="166" rx="8" fill="#20262C" stroke="#4B565F" stroke-width="1"/><rect x="146" y="58" width="116" height="132" rx="6" fill="#28312B" stroke="#76B900" stroke-width="1"/><rect x="148" y="60" width="112" height="40" rx="5" fill="#76B900" fill-opacity="0.18"/><text x="204" y="77" fill="#F3F4F6" font-size="13" font-weight="700" text-anchor="middle">0 · Ammonia</text><text x="204" y="93" fill="#A8B0B8" font-size="10" text-anchor="middle">rows 0:4</text><rect x="262" y="58" width="203" height="132" rx="6" fill="#28312B" stroke="#2E6F9E" stroke-width="1"/><rect x="264" y="60" width="199" height="40" rx="5" fill="#2E6F9E" fill-opacity="0.18"/><text x="363.5" y="77" fill="#F3F4F6" font-size="13" font-weight="700" text-anchor="middle">1 · Propyne</text><text x="363.5" y="93" fill="#A8B0B8" font-size="10" text-anchor="middle">rows 4:11</text><rect x="465" y="58" width="377" height="132" rx="6" fill="#28312B" stroke="#2E8A73" stroke-width="1"/><rect x="467" y="60" width="373" height="40" rx="5" fill="#2E8A73" fill-opacity="0.18"/><text x="653.5" y="77" fill="#F3F4F6" font-size="13" font-weight="700" text-anchor="middle">2 · Phenol</text><text x="653.5" y="93" fill="#A8B0B8" font-size="10" text-anchor="mid