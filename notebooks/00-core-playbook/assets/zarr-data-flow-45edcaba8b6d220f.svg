<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="115.2" viewBox="0 0 920 96" role="img" aria-labelledby="title desc"><title id="title">Saved Zarr records to a selected-device Batch</title><desc id="desc">A Zarr store on disk or in CPU storage feeds a Reader that returns CPU tensors. Dataset validates records and moves them to the configured device. DataLoader batches and prefetches, and the resulting Batch stays on that device.</desc><defs><marker id="zarr-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68737E"/></marker></defs><rect width="920" height="96" rx="8" fill="#171D20"/><g font-family="NVIDIA Sans,Arial,sans-serif" text-anchor="middle"><rect x="24" y="18" width="160" height="60" rx="6" fill="#28312B" stroke="#4B565F" stroke-width="1"/><text x="104" y="43" fill="#F3F4F6" font-size="13" font-weight="700">Zarr store</text><text x="104" y="63" fill="#A8B0B8" font-size="11">disk or CPU storage</text><rect x="202" y="18" width="160" height="60" rx="6" fill="#28312B" stroke="#4B565F" stroke-width="1"/><text x="282" y="43" fill="#F3F4F6" font-size="13" font-weight="700">Reader</text><text x="282" y="63" fill="#A8B0B8" font-size="11">CPU tensors</text><rect x="380" y="18" width="160" height="60" rx="6" fill="#28312B" stroke="#4B565F" stroke-width="1"/><text x="460" y="43" fill="#F3F4F6" font-size="13" font-weight="700">Dataset</text><text x="460" y="63" fill="#A8B0B8" font-size="11">validate + move</text><rect x="558" y="18" width="160" height="60" rx="6" fill="#28312B" stroke="#4B565F" stroke-width="1"/><text x="638" y="43" fill="#F3F4F6" font-size="13" font-weight="700">DataLoader</text><text x="638" y="63" fill="#A8B0B8" font-size="11">batch + prefetch</text><rect x="736" y="18" width="160" height="60" rx="6" fill="#76B900" stroke="#76B900" stroke-width="1"/><text x="816" y="43" fill="#11170D" font-size="13" font-weight="700">Batch</text><text x="816" y="63" fill="#11170D" font-size="11">selected device</text><path d="M184 48H198" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/><path d="M362 48H376" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/><path d="M540 48H554" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/><path d="M718 48H732" stroke="#68737E" stroke-width="1.25" marker-end="url(#zarr-flow-arrow)"/></g></svg>
