  <text x="434" y="68" fill="#F3F4F6" font-size="11" font-weight="700" letter-spacing="0.65">DOMAIN DECOMPOSITION</text>
  <text x="434" y="85" fill="#A8B0B8" font-size="10.5" font-weight="500">DomainParallel</text>
  <path d="M434 96h186" stroke="#3A444D"/>
  <text x="527" y="109" fill="#68737E" font-size="8.5" font-weight="700" letter-spacing="0.55" text-anchor="middle">ONE LARGE SYSTEM</text>
