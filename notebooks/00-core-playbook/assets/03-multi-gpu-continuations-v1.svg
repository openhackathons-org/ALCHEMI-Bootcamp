<svg xmlns="http://www.w3.org/2000/svg" width="920" height="198" viewBox="0 0 920 198" role="img" aria-labelledby="title desc" font-family="'NVIDIA Sans', 'NVIDIA Sans Regular', Arial, Helvetica, sans-serif">
  <title id="title">Scale the same atomistic workflow across GPUs</title>
  <desc id="desc">The single-GPU campaign from Module 03 is followed by three Toolkit multi-GPU layouts: a distributed pipeline, domain decomposition, and pipeline stages whose ranks each own a spatial domain.</desc>
