  <rect width="920" height="198" rx="8" fill="#171D20"/>
  <text x="24" y="30" fill="#F3F4F6" font-size="18" font-weight="700">Scale the same workflow across GPUs</text>

  <rect x="24" y="46" width="158" height="132" rx="6" fill="#20262C" stroke="#76B900" stroke-width="1.6"/>
  <rect x="38" y="58" width="86" height="20" rx="10" fill="#76B900"/>
  <text x="81" y="72" fill="#171D20" font-size="9.5" font-weight="800" letter-spacing="0.7" text-anchor="middle">YOU RAN THIS</text>
  <text x="38" y="99" fill="#F3F4F6" font-size="12" font-weight="700" letter-spacing="0.8">ONE GPU</text>
  <rect x="79" y="112" width="48" height="40" rx="4" fill="#20262C" stroke="#76B900"/>
  <text x="103" y="136" fill="#76B900" font-size="9" font-weight="700" letter-spacing="0.7" text-anchor="middle">GPU 0</text>
  <text x="103" y="168" fill="#F3F4F6" font-size="10" font-weight="600" text-anchor="middle">FusedStage + inflight</text>

  <rect x="194" y="46" width="214" height="132" rx="6" fill="#20262C" stroke="#4B565F"/>
  <text x="208" y="68" fill="#F3F4F6" font-size="11" font-weight="700" letter-spacing="0.65">DISTRIBUTED PIPELINE</text>
  <text x="208" y="85" fill="#A8B0B8" font-size="10.5" font-weight="500">DistributedPipeline</text>
  <path d="M208 96h186" stroke="#3A444D"/>
  <g fill="#20262C" stroke="#76B900">
    <rect x="208" y="112" width="48" height="40" rx="4"/>
    <rect x="276" y="112" width="48" height="40" rx="4"/>
