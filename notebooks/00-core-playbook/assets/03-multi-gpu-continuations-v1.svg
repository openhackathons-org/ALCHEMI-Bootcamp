    <text x="232" y="144">Relax</text><text x="300" y="144">MD</text><text x="368" y="143" fill-opacity="0.7">···</text>
  </g>
  <g fill="#76B900"><path d="M262 127l8 5-8 5Z"/><path d="M330 127l8 5-8 5Z"/></g>

