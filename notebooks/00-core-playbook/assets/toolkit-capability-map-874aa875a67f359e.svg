<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 360" role="img" aria-labelledby="title desc" style="display:block;max-width:940px"><title id="title">Interactive ALCHEMI Toolkit capability map</title><desc id="desc">ALCHEMI Toolkit and Toolkit-Ops connect to four areas: data and state, models and potentials, simulation workflows, and training and scale. Hover or focus a card to read its meaning, applications, documentation links, and course status.</desc><defs><filter id="soft-glow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#76B900" flood-opacity=".25"/></filter><marker id="cap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68737E"/></marker><style>
.title{font:700 19px 'NVIDIA Sans',Arial,sans-serif}.root-title{font:700 15px 'NVIDIA Sans',Arial,sans-serif}.label{font:700 14px 'NVIDIA Sans',Arial,sans-serif}.sub{font:500 11px 'NVIDIA Sans',Arial,sans-serif}.micro{font:600 9px 'NVIDIA Sans',Arial,sans-serif;letter-spacing:.02em}.tooltip-title{font:700 14px 'NVIDIA Sans',Arial,sans-serif}.tooltip-copy{font:500 11.5px 'NVIDIA Sans',Arial,sans-serif}.doc-label,.deep-status{font:700 11px 'NVIDIA Sans',Arial,sans-serif}.doc-label{fill:#76B900;text-decoration:underline}.deep-status{fill:#929BA4}.cap-card{transition:fill 150ms cubic-bezier(.23,1,.32,1),stroke 150ms cubic-bezier(.23,1,.32,1),filter 150ms cubic-bezier(.23,1,.32,1)}.capability:hover .cap-card{fill:#26351D;stroke:#76B900;filter:url(#soft-glow)}.cap-tooltip{visibility:hidden;opacity:0;pointer-events:none;transition:opacity 150ms ease}.capability:hover .cap-tooltip{visibility:visible;opacity:1;pointer-events:auto}.icon{fill:none;stroke:#76B900;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}@media (prefers-reduced-motion:reduce){.cap-card,.cap-tooltip{transition:none}}
</style></defs><rect width="940" height="360" rx="10" fill="#11161B"/><text x="24" y="29" class="title" fill="#F3F4F6">Toolkit capabilities and the work they enable</text><rect x="24" y="45" width="892" height="58" rx="8" fill="#76B900" stroke="#76B900"/><text x="44" y="70" class="root-title" fill="#081005">ALCHEMI Toolkit</text><text x="44" y="90" class="sub" fill="#15200D">reusable data · model · workflow · training tools</text><rect x="646" y="54" width="254" height="40" rx="6" fill="#172119" stroke="#43533B"/><text x="660" y="72" class="micro" fill="#F3F4F6">TOOLKIT-OPS</text><text x="660" y="87" class="sub" fill="#A8B0B8">neighbors · reductions · interactions</text><path d="M470 103V181M125 181H815" fill="none" stroke="#68737E" stroke-width="1.25"/><path d="M125 181V236" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M355 181V236" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M585 181V236" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><path d="M815 181V236" fill="none" stroke="#68737E" stroke-width="1.25" marker-end="url(#cap-arrow)"/><g id="data" class="capability" data-icon="data" aria-label="Data and state. Hold atomistic data as validated tensors on the model device."><g class="cap-tooltip"><rect x="16" y="104" width="218" height="141" rx="8" fill="#1B211D" stroke="#76B900"/><text x="30" y="127" class="tooltip-title" fill="#F3F4F6">Data and state</text><text x="30" y="148" class="tooltip-copy" fill="#B9C0C6">Hold atomistic data as validated tensors</text><text x="30" y="163" class="tooltip-copy" fill="#B9C0C6">on the model device.</text><text x="30" y="183" class="tooltip-copy" fill="#A8B0B8">model input · datasets · trajectories</text><text x="30" y="207" class="doc-label">Docs ↗</text><text x="30" y="223" class="micro" fill="#68737E">DEEP DIVES · IN PROGRESS</text><text x="30" y="238" class="deep-status">Part 01</text><text x="77" y="238" class="deep-status">Part 02</text><rect x="16" y="232" width="218" height="14" fill="transparent"/></g><rect class="cap-card" x="24" y="246" width="202" height="84" rx="8" fill="#20262C" stroke="#3A444D"/><g class="icon" transform="translate(36 258)"><circle cx="7" cy="8" r="1.4"/><circle cx="17" cy="8" r="1.4"/><circle cx="12" cy="17" r="1.4"/><path d="M8.5 8h7M7.8 9.2l3.4 6.4m5-6.4-3.4 6.4"/></g><text x="68" y="273" class="label" fill="#F3F4F6">Data and state</text><text x="38" y="301" class="sub" fill="#A8B0B8">01 AtomicData + Batch</text><text x="38" y="317" class="sub" fill="#A8B0B8">02 Zarr data</text></g><g id="models" class="capability" data-icon="models" aria-label="Models and potentials. Evaluate energy, forces, stress, charges, and other outputs."><g class="cap-tooltip"><rect x="246" y="104" width="218" height="141" rx="8" fill="#1B211D" stroke="#76B900"/><text x="260" y="127" class="tooltip-title" fill="#F3F4F6">Models and potentials</text><text x="260" y="148" class="tooltip-copy" fill="#B9C0C6">Evaluate energy, forces, stress, charges,</text><text x="260" y="163" class="tooltip-copy" fill="#B9C0C6">and other outputs.</text><text x="260" y="183" class="tooltip-copy" fill="#A8B0B8">MLIPs · custom models · hybrid potentials</text><text x="260" y="207" class="doc-label">Docs ↗</text><text x="260" y="223" class="micro" fill="#68737E">DEEP DIVES · IN PROGRESS</text><text x="260" y="238" class="deep-status">Part 03</text><rect x="246" y="232" width="218" height="14" fill="transparent"/></g><rect class="cap-card" x="254" y="246" width="202" height="84" rx="8" fill="#20262C" stroke="#3A444D"/><g class="icon" transform="translate(266 258)"><path d="m4 8 8-4 8 4-8 4zM4 12l8 4 8-4M4 16l8 4 8-4"/></g><text x="298" y="273" class="label" fill="#F3F4F6">Models and potentials</text><text x="268" y="301" class="sub" fill="#A8B0B8">03 Models + composition</text><text x="268" y="317" class="sub" fill="#A8B0B8"></text></g><g id="simulation" class="capability" data-icon="simulation" aria-label="Simulation workflows. Simulate batches of chemical systems with optimization, molecular dynamics, and screening."><g class="cap-tooltip"><rect x="476" y="104" width="218" height="141" rx="8" fill="#1B211D" stroke="#76B900"/><text x="490" y="127" class="tooltip-title" fill="#F3F4F6">Simulation workflows</text><text x="490" y="148" class="tooltip-copy" fill="#B9C0C6">Simulate batches of chemical systems with</text><text x="490" y="163" class="tooltip-copy" fill="#B9C0C6">optimization, molecular dynamics, and screening.</text><text x="490" y="183" class="tooltip-copy" fill="#A8B0B8">FIRE2 · NVE/NVT · hooks</text><text x="490" y="207" class="doc-label">Docs ↗</text><text x="490" y="223" class="micro" fill="#68737E">DEEP DIVES · IN PROGRESS</text><text x="490" y="238" class="deep-status">Part 04</text><text x="537" y="238" class="deep-status">Part 05</text><text x="584" y="238" class="deep-status">Part 06</text><rect x="476" y="232" width="218" height="14" fill="transparent"/></g><rect class="cap-card" x="484" y="246" width="202" height="84" rx="8" fill="#20262C" stroke="#3A444D"/><g class="icon" transform="translate(496 258)"><path d="M19 8a8 8 0 0 0-13-2L4 8m0-4v4h4M5 16a8 8 0 0 0 13 2l2-2m0 4v-4h-4"/></g><text x="528" y="273" class="label" fill="#F3F4F6">Simulation workflows</text><text x="498" y="301" class="sub" fill="#A8B0B8">04 Hooks · 05 Dynamics</text><text x="498" y="317" class="sub" fill="#A8B0B8">06 GPU pipelines</text></g><g id="scale" class="capability" data-icon="scale" aria-label="Training and scale. Train and fine-tune models, then partition one large spatial system across multiple GPUs."><g class="cap-tooltip"><rect x="706" y="104" width="218" height="141" rx="8" fill="#1B211D" stroke="#76B900"/><text x="720" y="127" class="tooltip-title" fill="#F3F4F6">Training and scale</text><text x="720" y="148" class="tooltip-copy" fill="#B9C0C6">Train and fine-tune models, then partition</text><text x="720" y="163" class="tooltip-copy" fill="#B9C0C6">one large spatial system across multiple GPUs.</text><text x="720" y="183" class="tooltip-copy" fill="#A8B0B8">TrainingStrategy · domain decomposition</text><text x="720" y="207" class="doc-label">Training docs ↗</text><text x="808" y="207" class="doc-label">Scale docs ↗</text><text x="720" y="223" class="micro" fill="#68737E">DEEP DIVES · IN PROGRESS</text><text x="720" y="238" class="deep-status">Part 07</text><text x="767" y="238" class="deep-status">Part 08</text><rect x="706" y="232" width="218" height="14" fill="transparent"/></g><rect class="cap-card" x="714" y="246" width="202" height="84" rx="8" fill="#20262C" stroke="#3A444D"/><g class="icon" transform="translate(726 258)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 12h18"/><circle cx="7" cy="8" r="1"/><circle cx="17" cy="8" r="1"/><circle cx="7" cy="16" r="1"/><circle cx="17" cy="16" r="1"/></g><text x="758" y="273" class="label" fill="#F3F4F6">Training and scale</text><text x="728" y="301" class="sub" fill="#A8B0B8">07 Training</text><text x="728" y="317" class="sub" fill="#A8B0B8">08 Multi-GPU scale</text></g><text x="24" y="349" class="sub" fill="#A8B0B8">Four areas, one shared data path. Docs are maintained; focused course notebooks are in progress.</text></svg>
