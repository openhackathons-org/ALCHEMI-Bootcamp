<svg xmlns="http://www.w3.org/2000/svg" width="920" height="246" viewBox="0 0 920 246" role="img" aria-labelledby="title desc">
<title id="title">ALCHEMI Toolkit, Toolkit-Ops bindings, and operation implementations</title>
<desc id="desc">The highlighted path runs from ALCHEMI Toolkit PyTorch-facing APIs through Toolkit-Ops Torch bindings and a selected operation to accelerated Warp kernels. A muted JAX program reaches supported Warp kernels through separate Toolkit-Ops JAX bindings. Some Toolkit-Ops Torch operations or utilities use a documented Torch-native implementation.</desc>
<defs>
<marker id="framework-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76B900"/></marker>
<marker id="framework-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68737E"/></marker>
</defs>
<rect width="920" height="246" rx="8" fill="#11161B"/>
<g font-family="NVIDIA Sans,Arial,sans-serif" text-anchor="middle">
<text x="460" y="25" fill="#F3F4F6" font-size="18" font-weight="700">ALCHEMI Toolkit follows the Torch binding path</text>
<text x="113" y="48" fill="#A8B0B8" font-size="10" font-weight="700">CALLER</text>
<text x="343" y="48" fill="#A8B0B8" font-size="10" font-weight="700">TOOLKIT-OPS BINDING</text>
<text x="573" y="48" fill="#A8B0B8" font-size="10" font-weight="700">OPERATION</text>
<text x="810" y="48" fill="#A8B0B8" font-size="10" font-weight="700">IMPLEMENTATION</text>
<rect x="18" y="61" width="190" height="55" rx="6" fill="#76B900" stroke="#76B900"/>
<text x="113" y="84" fill="#081005" font-size="14" font-weight="700">ALCHEMI Toolkit</text>
<text x="113" y="103" fill="#15200D" font-size="11">PyTorch-facing APIs</text>
<rect x="248" y="61" width="190" height="55" rx="6" fill="#20262C" stroke="#76B900"/>
<text x="343" y="93" fill="#F3F4F6" font-size="13" font-weight="700">Toolkit-Ops Torch bindings</text>
<rect x="478" y="61" width="190" height="55" rx="6" fill="#20262C" stroke="#76B900"/>
<text x="573" y="93" fill="#F3F4F6" font-size="13" font-weight="700">Selected operation</text>
<rect x="713" y="61" width="190" height="55" rx="6" fill="#20262C" stroke="#76B900"/>
<text x="808" y="84" fill="#F3F4F6" font-size="13" font-weight="700">Accelerated Warp kernels</text>
<text x="808" y="103" fill="#A8B0B8" font-size="11">CPU or CUDA</text>
<rect x="18" y="146" width="190" height="55" rx="6" fill="#3A332C" stroke="#68737E"/>
<text x="113" y="169" fill="#A8B0B8" font-size="13" font-weight="700">JAX program</text>
<text x="113" y="188" fill="#68737E" font-size="11">not used here</text>
<rect x="248" y="146" width="190" height="55" rx="6" fill="#20262C" stroke="#68737E"/>
<text x="343" y="178" fill="#A8B0B8" font-size="13" font-weight="700">Toolkit-Ops JAX bindings</text>
<rect x="713" y="146" width="190" height="55" rx="6" fill="#20262C" stroke="#68737E"/>
<text x="808" y="169" fill="#A8B0B8" font-size="13" font-weight="700">Torch-native operations</text>
<text x="808" y="188" fill="#68737E" font-size="11">where documented</text>
<path d="M208 88H238" stroke="#76B900" stroke-width="2" marker-end="url(#framework-arrow-green)"/>
<path d="M438 88H468" stroke="#76B900" stroke-width="2" marker-end="url(#framework-arrow-green)"/>
<path d="M668 88H703" stroke="#76B900" stroke-width="2" marker-end="url(#framework-arrow-green)"/>
<path d="M208 173H238" stroke="#68737E" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#framework-arrow-muted)"/>
<path d="M438 173C560 173 610 116 703 100" fill="none" stroke="#68737E" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#framework-arrow-muted)"/>
<path d="M438 101C560 122 610 173 703 173" fill="none" stroke="#68737E" stroke-width="1.4" marker-end="url(#framework-arrow-muted)"/>
</g>
<text x="18" y="229" fill="#A8B0B8" font-family="NVIDIA Sans,Arial,sans-serif" font-size="11">Arrows show API delegation toward an operation implementation. Results return through the same binding.</text>
</svg>
