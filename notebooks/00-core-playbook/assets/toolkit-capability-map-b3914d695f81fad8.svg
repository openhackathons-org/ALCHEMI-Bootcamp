<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-labelledby="title desc"><title id="title">Interactive ALCHEMI Toolkit capability map</title><desc id="desc">ALCHEMI Toolkit and Toolkit-Ops connect to four areas: data and state, models and potentials, simulation workflows, and training and scale. Hover or focus a card to read its meaning, applications, documentation, and course links.</desc><defs><filter id="soft-glow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#76B900" flood-opacity=".25"/></filter><marker id="cap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68737E"/></marker><style>
